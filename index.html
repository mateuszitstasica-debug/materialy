<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pracownia Techniczna</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --paper:#f4f5f8; --card:#ffffff; --ink:#111a2e; --muted:#5d6679; --line:#e2e5ec; --line2:#eef0f4;
  --navy:#0d1830; --navy2:#1a2b52; --accent:#f2a33a; --c:#1a2b52;
  --ok:#2e7d4f; --bad:#b3362a; --r:14px; --sh:0 1px 2px rgba(17,26,46,.04),0 4px 16px rgba(17,26,46,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
/* HEADER */
header.top{background:radial-gradient(1200px 400px at 85% -10%,rgba(242,163,58,.18),transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
header.top:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 30%,transparent);pointer-events:none}
header.top .wrap{position:relative}
.bar{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:.1px}
.logo .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:600;background:linear-gradient(135deg,var(--accent),#e0732b);color:#1a1200;box-shadow:0 4px 14px rgba(242,163,58,.35)}
.logo small{display:block;font-weight:400;font-family:var(--mono);font-size:11.5px;opacity:.7;letter-spacing:.3px}
nav.main{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;background:rgba(255,255,255,.06);padding:4px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
nav.main a{text-decoration:none;font-size:13.5px;padding:7px 9px;white-space:nowrap;border-radius:9px;opacity:.82;transition:background .15s,opacity .15s}
nav.main a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.main a.on{opacity:1;background:#fff;color:var(--navy);font-weight:600}
nav.main a.adm-link{color:var(--accent);opacity:1}
nav.main a.adm-link.on{background:var(--accent);color:#1a1200}
.hero{padding:34px 0 52px;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}
.hero:empty{display:none}
.hero .tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;letter-spacing:.5px;color:var(--accent);background:rgba(242,163,58,.1);border:1px solid rgba(242,163,58,.25);padding:5px 11px;border-radius:99px}
.hero h1{font-size:clamp(30px,4.4vw,48px);line-height:1.08;margin:16px 0 14px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:600px;opacity:.82;margin:0 0 24px;font-size:17px}
.hero .stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hero .stats div{font-family:var(--mono);font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.hero .stats b{display:block;font-family:var(--sans);font-size:26px;opacity:1;color:#fff;letter-spacing:0}
.hero .deco{opacity:.9}
.hero .deco svg{width:100%;height:auto;max-height:300px}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero .deco{display:none}}
@media(max-width:640px){nav.main{width:100%;overflow-x:auto;flex-wrap:nowrap}nav.main a{white-space:nowrap;padding:7px 10px}.hero{padding:18px 0 34px}}
.search{display:flex;max-width:560px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.search input{flex:1;border:0;padding:14px 16px;font:inherit;color:var(--ink);outline:none;font-size:15.5px}
.search span{padding:14px 16px;color:var(--muted);font-size:18px}
main{padding:34px 0 70px;min-height:60vh}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.2px}
.sec-label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sec-label:after{content:"";flex:1;height:1px;background:var(--line)}
/* KIERUNKI */
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:40px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--sh);overflow:hidden}
.tile:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(17,26,46,.12);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.tile .ico{flex:none;width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 11%,white)}
.tile .ico svg{width:30px;height:30px}
.tile h3{margin:2px 0 0;font-size:19px;line-height:1.25;letter-spacing:-.2px}
.tile p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tile .go{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);padding-top:12px;margin-top:4px;font-size:13px;color:var(--muted)}
.tile .go b{color:var(--ink)}
.tile .go .arr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 11%,white);color:var(--c);font-weight:700;transition:transform .18s}
.tile:hover .go .arr{transform:translateX(3px)}
.counts{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line2);padding-top:12px;flex-wrap:wrap}
.counts b{color:var(--ink)}
/* KLASY */
.klasy{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:16px}
.klasa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 16px;text-decoration:none;text-align:center;transition:transform .18s,box-shadow .18s;box-shadow:var(--sh);position:relative;overflow:hidden}
.klasa:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(17,26,46,.12)}
.klasa .num{font-family:var(--mono);font-size:52px;font-weight:600;color:var(--c);line-height:1}
.klasa .lbl{font-weight:600;margin-top:8px}
.klasa .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.klasa.zero{opacity:.55;box-shadow:none}
@media(max-width:820px){.klasy{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:22px}
.cols.one{grid-template-columns:1fr}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.news li:last-child{border:0}
.date{font-family:var(--mono);font-size:12px;text-align:center;border-radius:10px;padding:8px 2px;line-height:1.2;height:fit-content;background:var(--paper)}
.date b{display:block;font-size:21px}
.news h4{margin:0 0 2px;font-size:15.5px}
.news p{margin:0 0 6px;font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);font-weight:600;white-space:nowrap;width:fit-content}
.crumb{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.crumb a{text-decoration:none;color:var(--ink);opacity:.75}
.crumb a:hover{opacity:1;text-decoration:underline}
.subhead{display:flex;align-items:center;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.subhead .ico{width:62px;height:62px;flex:none;border-radius:16px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 11%,white)}
.subhead .ico svg{width:36px;height:36px}
.subhead h1{margin:2px 0 0;font-size:30px;line-height:1.15;letter-spacing:-.4px}
.subhead p{margin:4px 0 0;color:var(--muted)}
.tabs{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:12px;margin-bottom:20px;box-shadow:var(--sh)}
.tabs button{background:none;border:0;padding:9px 20px;font-weight:600;color:var(--muted);border-radius:9px;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--c);color:#fff}
.chips{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:box-shadow .18s,transform .18s}
.item:hover{box-shadow:0 12px 30px rgba(17,26,46,.1)}
.item h3{margin:0;font-size:17.5px;line-height:1.3}
.item p{margin:0;font-size:14px;color:var(--muted);flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;text-decoration:none;width:fit-content;line-height:1.2;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#c9ceda;filter:none}
.btn.accent{background:var(--c);border-color:var(--c)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:#fff;color:var(--bad);border-color:#ecc3bd}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.empty{color:var(--muted);padding:30px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;background:rgba(255,255,255,.6)}
.viewer{background:var(--navy);border-radius:var(--r);padding:14px}
.slide{aspect-ratio:16/9;background:#fff;border-radius:8px;padding:4.5% 6% 6%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:3% 4%;align-items:center;position:relative;overflow:hidden}
.slide.solo{grid-template-columns:1fr}
.slide h2{grid-column:1/-1;font-size:clamp(18px,2.6vw,30px);margin:0;align-self:start;border-bottom:3px solid var(--c);padding-bottom:8px}
.slide ul{margin:0;padding-left:1.2em;font-size:clamp(13px,1.6vw,19px)}
.slide li{margin:.35em 0}
.slide .fig{display:flex;justify-content:center;align-items:center;height:100%;min-height:0}
.slide .fig img{max-width:100%;max-height:100%;object-fit:contain}
.slide .no{position:absolute;right:14px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.slide .school{position:absolute;left:6%;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ctrl{display:flex;justify-content:space-between;align-items:center;color:#fff;padding-top:12px;font-family:var(--mono);font-size:13px;gap:8px}
.ctrl button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:8px 14px}
.ctrl button:disabled{opacity:.3}
.test-box{max-width:780px}
.studinfo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.studinfo input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--sh)}
.q .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q h4{margin:4px 0 10px;font-size:16px;white-space:pre-line}
.q img{max-width:100%;max-height:260px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.opt:hover{background:#fafbfc}
.opt input{margin-top:4px}
.opt.good{border-color:var(--ok);background:#eaf5ee}
.opt.wrong{border-color:var(--bad);background:#fbecea}
.expl{display:none;margin-top:8px;font-size:14px;background:#f6f7f9;border-left:3px solid var(--c);padding:8px 12px;font-family:var(--mono);white-space:pre-line;border-radius:0 8px 8px 0}
.done .expl{display:block}
.result{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px;margin:16px 0}
.result .big{font-size:40px;font-weight:700;font-family:var(--mono)}
.timer{font-family:var(--mono);font-size:18px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;position:fixed;right:20px;bottom:20px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;max-width:900px;box-shadow:var(--sh)}
.task .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.task .head h1{margin:6px 0 0;font-size:24px}
.task h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono);margin:22px 0 8px;color:var(--c)}
.task ol,.task ul{margin:0;padding-left:1.3em}
.task li{margin:.3em 0}
.task p{white-space:pre-line}
.schem{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfc;display:flex;justify-content:center}
.schem img{max-width:100%;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f4f5f8;font-family:var(--mono);font-size:12px;text-transform:uppercase}
td.pts{width:90px;text-align:center;font-family:var(--mono)}
.warn{background:#fff6e0;border:1px solid #edd394;border-radius:10px;padding:11px 13px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.toolbar{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap;align-items:center}
.mono{font-family:var(--mono)}
footer{border-top:1px solid var(--line);padding:26px 0;font-size:13px;color:var(--muted);background:#fff}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res-list{font-size:14px;margin:0;padding:0;list-style:none}
.res-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.banner{background:#fff6e0;border:1px solid #edd394;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px}
.banner:empty{display:none}
.fileview{max-width:940px}
.fileview iframe{box-shadow:var(--sh)}
.officebox{position:relative;width:100%;aspect-ratio:16/10.4;min-height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.officebox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pdfpage{display:block;max-width:100%;height:auto;margin:0 0 16px;background:#fff;box-shadow:0 2px 14px rgba(17,26,46,.14);border-radius:4px}
.fileicon{width:44px;height:52px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;background:var(--c);position:relative}
.fileicon:after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--paper) rgba(255,255,255,.35) transparent;border-radius:0 8px 0 4px}
.item .ftop{display:flex;gap:14px;align-items:flex-start}
/* ADMIN */
.adm{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.adm-side{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--sh)}
.adm-side button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.adm-side button:hover{color:var(--ink);background:var(--paper)}
.adm-side button.on{background:var(--ink);color:#fff}
@media(max-width:820px){.adm{grid-template-columns:1fr}.adm-side{flex-direction:row;flex-wrap:wrap;position:static}}
.form{display:grid;gap:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--navy2) 30%,transparent);border-color:var(--navy2)}
.field textarea{min-height:84px;resize:vertical}
.field input[type=color]{width:60px;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfc;display:grid;gap:10px}
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rep-head .acts{display:flex;gap:4px}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.lrow .grow{flex:1;min-width:180px}
.lrow .grow b{display:block}
.lrow .grow span{font-size:13px;color:var(--muted)}
.optrow{display:flex;gap:8px;align-items:center}
.optrow input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.imgprev{max-width:260px;max-height:170px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;margin-bottom:6px}
.status{font-size:13px;font-family:var(--mono)}
.status.ok{color:var(--ok)} .status.err{color:var(--bad)}
.stickybar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}
.h3{font-size:18px;margin:22px 0 10px}
@media print{
  header.top,footer,.toolbar,.crumb,.banner{display:none!important}
  body{background:#fff}
  .task{border:0;padding:0;box-shadow:none}
}

/* --- grafiki --- */
.tart{position:relative;margin:-22px -22px 6px;height:128px;color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,white),color-mix(in srgb,var(--c) 3%,white));border-bottom:1px solid color-mix(in srgb,var(--c) 14%,var(--line));display:flex;align-items:center;justify-content:center;overflow:hidden}
.tart svg{width:92%;height:112px;transition:transform .3s}
.tile:hover .tart svg{transform:scale(1.04)}
.tart .pill{position:absolute;top:12px;right:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.subhead.banner{background:linear-gradient(110deg,color-mix(in srgb,var(--c) 8%,white),#fff 70%);border:1px solid color-mix(in srgb,var(--c) 16%,var(--line));border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh);flex-wrap:nowrap;overflow:hidden}
.subhead .grow{flex:1;min-width:0}
.subart{flex:none;width:300px;color:var(--c);margin:-8px -6px -8px 0}
.subart svg{width:100%;height:auto;display:block}
@media(max-width:820px){.subart{display:none}.subhead.banner{flex-wrap:wrap}}

function gearPath(cx,cy,r,n,d){
  var pts=[],step=Math.PI*2/(n*4);
  for(var i=0;i<n*4;i++){var rr=(i%4<2)?r:r-d;var a=i*step-Math.PI/2;pts.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}
  return '<path d="M'+pts.join("L")+'Z"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.38).toFixed(1)+'"/>';
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function getPath(o,p){return p.split(".").reduce(function(a,k){return a==null?a:a[k]},o)}
function setPath(o,p,v){var ks=p.split(".");var last=ks.pop();var t=ks.reduce(function(a,k){return a[k]},o);t[last]=v}
function $(sel,root){return (root||document).querySelector(sel)}
function $$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}
function byOrder(a,b){return (a.kolejnosc||0)-(b.kolejnosc||0)||String(a.tytul||a.nazwa).localeCompare(String(b.tytul||b.nazwa),"pl")}

/* ================== STAN I MAGAZYN DANYCH ================== */
var S={mode:null,config:clone(DEFAULT_CONFIG),przedmioty:[],materialy:[],ready:false,admin:false,err:null};
var DB=null,USER=null;
var ui={lock:false,slide:0,tab:"teoria",timer:null,
  adm:{tab:"przedmioty",kier:"mechatronik",klasa:1,subj:null,editSubj:null,mat:null,ogl:null,cfg:null}};

function mergeConfig(c){
  var d=clone(DEFAULT_CONFIG); if(!c) return d;
  var out=Object.assign({},d,c);
  out.kierunki=d.kierunki.map(function(k){var x=(c.kierunki||[]).filter(function(y){return y.id===k.id})[0];return Object.assign({},k,x||{})});
  out.ogloszenia=Array.isArray(c.ogloszenia)?c.ogloszenia:[];
  out.progi=Array.isArray(c.progi)&&c.progi.length===4?c.progi:d.progi;
  return out;
}
function strip(o){var c=clone(o);delete c.id;return c}
function saveLocal(){LS.set("pz-data",{config:S.config,przedmioty:S.przedmioty,materialy:S.materialy})}
function upsert(arr,o){var i=arr.findIndex(function(x){return x.id===o.id});if(i>=0)arr[i]=o;else arr.push(o)}
function errMsg(e){
  if(e&&e.message&&!e.code) return e.message;
  var c=e&&e.code;
  if(c==="invalid_argument") return "Zapis odrzucony — brak uprawnień albo dokument jest za duży.";
  if(c==="quota_exceeded") return "Brak miejsca w bazie. Usuń niepotrzebne materiały lub obrazy.";
  if(c==="resource_exhausted") return "Za dużo operacji naraz — spróbuj za chwilę.";
  return "Nie udało się zapisać ("+(c||"błąd")+"). Spróbuj ponownie.";
}
var Store={
  saveConfig:async function(c){S.config=c; if(S.mode==="db") await DB.doc("site/config").set(clone(c)); else saveLocal();},
  savePrzedmiot:async function(p){upsert(S.przedmioty,p); if(S.mode==="db") await DB.collection("przedmioty").doc(p.id).set(strip(p)); else saveLocal();},
  delPrzedmiot:async function(id){
    var mats=S.materialy.filter(function(m){return m.przedmiot===id});
    for(var i=0;i<mats.length;i++) await Store.delMaterial(mats[i].id);
    S.przedmioty=S.przedmioty.filter(function(p){return p.id!==id});
    if(S.mode==="db") await DB.collection("przedmioty").doc(id).delete(); else saveLocal();
  },
  saveMaterial:async function(m){
    m.zmieniono=new Date().toISOString();
    if(JSON.stringify(m).length>250000) throw new Error("Materiał jest za duży (obrazy). Usuń część obrazów albo wgraj mniejsze pliki.");
    upsert(S.materialy,m); if(S.mode==="db") await DB.collection("materialy").doc(m.id).set(strip(m)); else saveLocal();
  },
  delMaterial:async function(id){S.materialy=S.materialy.filter(function(m){return m.id!==id}); if(S.mode==="db") await DB.collection("materialy").doc(id).delete(); else saveLocal();},
  replaceAll:async function(data,progress){
    var oldM=S.materialy.slice(),oldP=S.przedmioty.slice(),i;
    for(i=0;i<oldM.length;i++){progress("Usuwanie starych materiałów "+(i+1)+"/"+oldM.length);await Store.delMaterial(oldM[i].id)}
    for(i=0;i<oldP.length;i++){progress("Usuwanie przedmiotów "+(i+1)+"/"+oldP.length);S.przedmioty=S.przedmioty.filter(function(p){return p.id!==oldP[i].id}); if(S.mode==="db") await DB.collection("przedmioty").doc(oldP[i].id).delete();}
    await Store.saveConfig(mergeConfig(data.config));
    var ps=data.przedmioty||[],ms=data.materialy||[];
    for(i=0;i<ps.length;i++){progress("Zapisywanie przedmiotów "+(i+1)+"/"+ps.length);await Store.savePrzedmiot(ps[i])}
    for(i=0;i<ms.length;i++){progress("Zapisywanie materiałów "+(i+1)+"/"+ms.length);await Store.saveMaterial(ms[i])}
    if(S.mode!=="db") saveLocal();
  }
};

async function init(){
  renderShell();
  if(window.EMBEDDED){
    S.mode="static"; var e=window.EMBEDDED;
    S.config=mergeConfig(e.config); S.przedmioty=e.przedmioty||[]; S.materialy=e.materialy||[];
    S.ready=true; route(true); return;
  }
  if(!window.claude||typeof window.claude.use!=="function"){
    S.mode="local"; var d=LS.get("pz-data",null);
    if(d){S.config=mergeConfig(d.config);S.przedmioty=d.przedmioty||[];S.materialy=d.materialy||[]}
    S.admin=true; S.ready=true; route(true); return;
  }
  S.mode="db"; route(true);
  DB=await window.claude.use("db");
  USER=await window.claude.use("user");
  if(!DB){S.err="nodb";S.ready=true;route(true);return}
  try{S.admin=!!(USER&&await USER.canEdit())}catch(e){S.admin=false}
  var got={c:false,p:false,m:false};
  var timer=setTimeout(function(){if(!S.ready){S.err="timeout";route(true)}},10000);
  function done(){
    if(got.c&&got.p&&got.m&&!S.ready){S.ready=true;S.err=null;clearTimeout(timer);route(false);return}
    if(S.ready) changed();
  }
  function onErr(){S.err=S.err||"error";got.c=got.p=got.m=true;done()}
  DB.doc("site/config").onSnapshot(function(s){S.config=mergeConfig(s.exists?s.data():null);got.c=true;done()},onErr);
  DB.collection("przedmioty").onSnapshot(function(q){S.przedmioty=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});got.p=true;done()},onErr);
  DB.collection("materialy").onSnapshot(function(q){S.materialy=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});got.m=true;done()},onErr);
}
function changed(){updateNav();if(!ui.lock) route(false)}

function curHash(){var h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}return h||"start"}
function kierOf(h){
  if(h.indexOf("k-")===0) return h.slice(2).split("-")[0];
  var p=null;
  if(h.indexOf("s-")===0) p=przedmiot(h.slice(2));
  if(h.indexOf("m-")===0){var m=material(h.slice(2)); if(m) p=przedmiot(m.przedmiot)}
  return p?p.kierunek:null;
}
function updateNav(){

  $("#banner").textContent=b;
}
function hero(on){
  var el=$("#hero");
  if(!on){el.innerHTML="";return}
  var c=S.config;
  if(!$("#q")) el.innerHTML='<div>'+topicStrip()+'<h1>'+esc(c.heroTytul)+'</h1><p>'+esc(c.heroOpis)+'</p><label class="search"><input id="q" type="search" placeholder="Szukaj przedmiotu lub materiału…"><span>⌕</span></label>'+
    '<div class="stats"><div><b>'+c.kierunki.length+'</b>kierunków</div><div><b>'+S.przedmioty.length+'</b>przedmiotów</div><div><b>'+S.materialy.length+'</b>materiałów</div></div>'+(c.heroTag?'<div class="author"><span class="amark">'+logoSvg()+'</span><div><small>Materiały przygotował</small><b>'+esc(c.heroTag)+'</b></div></div>':'')+'</div>'+
    '<div class="deco" aria-hidden="true">'+heroArt()+'</div>';

}
function app(){return $("#app")}

/* ================== DANE ================== */
function kier(id){return S.config.kierunki.filter(function(k){return k.id===id})[0]}
function przedmiot(id){return S.przedmioty.filter(function(p){return p.id===id})[0]}
function material(id){return S.materialy.filter(function(m){return m.id===id})[0]}
function subjectsOf(kid,kl){return S.przedmioty.filter(function(p){return p.kierunek===kid&&(kl==null||+p.klasa===+kl)}).sort(byOrder)}
function matsOf(pid,typ){return S.materialy.filter(function(m){return m.przedmiot===pid&&(!typ||m.typ===typ)}).sort(byOrder)}
function matsOfKier(kid){var ids=subjectsOf(kid).map(function(p){return p.id});return S.materialy.filter(function(m){return ids.indexOf(m.przedmiot)>=0})}
function klasyOf(k){var n=+(k&&k.klasy)||5;var a=[];for(var i=1;i<=n;i++)a.push(i);return a}
function ocena(pct){var p=S.config.progi;if(pct>=p[0])return["bardzo dobry","5"];if(pct>=p[1])return["dobry","4"];if(pct>=p[2])return["dostateczny","3"];if(pct>=p[3])return["dopuszczający","2"];return["niedostateczny","1"]}
function cvar(k){return "--c:"+esc(k?k.kolor:"#14213d")}
function fmtDate(s){var d=new Date(s+"T12:00:00");if(isNaN(d))return{d:"--",m:""};return{d:String(d.getDate()).padStart(2,"0"),m:MIES[d.getMonth()]}}
function todayStr(off){var d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ================== ROUTER ================== */
function route(scroll){
  clearInterval(ui.timer); ui.lock=false;
  if(scroll) window.scrollTo(0,0);
  updateNav();
  var h=curHash();
  if(!S.ready){hero(false);app().innerHTML='<div class="empty">Wczytywanie materiałów…</div>';return}
  if(S.err==="nodb"){hero(false);app().innerHTML='<div class="empty">Zaloguj się, aby zobaczyć materiały.</div>';return}
  if(S.err==="timeout"&&!S.przedmioty.length){hero(false);app().innerHTML='<div class="empty">Nie udało się wczytać materiałów. Sprawdź połączenie z internetem i odśwież stronę.</div>';return}
  if(h==="admin"){ if(S.admin) return adminView(); }
  if(h==="egzaminy") return egzListView();
  if(h==="wyniki") return wynikiView();
  if(h==="kontakt") return kontaktView();
  if(h==="wychowawca") return wychowawcaView();
  if(h.indexOf("e-")===0) return egzView(h.slice(2));
  if(h.indexOf("k-")===0){var parts=h.slice(2).split("-"),k=kier(parts[0]); if(k){return (parts[1]&&+parts[1]>=1&&+parts[1]<=klasyOf(k).length)?klasaView(k,+parts[1]):kierunekView(k)}}
  if(h.indexOf("s-")===0){var p=przedmiot(h.slice(2)); if(p) return przedmiotView(p)}
  if(h.indexOf("m-")===0){var m=material(h.slice(2)); if(m) return materialView(m)}
  home();
}
window.addEventListener("hashchange",function(){ui.slide=0;route(true)});

var EGZ={lista:null,p:null,bank:{}};
function egzUrl(path){return fileUrl({sciezka:path})}
function egzLista(){
  if(EGZ.lista) return Promise.resolve(EGZ.lista);
  if(!EGZ.p) EGZ.p=fetch(egzUrl("egzaminy/lista.json")+"?t="+Math.floor(Date.now()/60000)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(l){EGZ.lista=Array.isArray(l)?l:[];return EGZ.lista}).catch(function(){EGZ.p=null;EGZ.lista=null;return []});
  return EGZ.p;
}
function egzBank(id){
  if(EGZ.bank[id]) return Promise.resolve(EGZ.bank[id]);
  return fetch(egzUrl("egzaminy/"+id+".json")+"?t="+Math.floor(Date.now()/60000)).then(function(r){if(!r.ok)throw new Error("Nie udało się pobrać pytań.");return r.json()}).then(function(b){EGZ.bank[id]=b;return b});
}
function egzKey(id){return "pz-egz-"+id}
function egzState(id){try{return JSON.parse(sessionStorage.getItem(egzKey(id))||"null")}catch(e){return null}}
function egzSave(id,st){try{sessionStorage.setItem(egzKey(id),JSON.stringify(st))}catch(e){}}
function egzClear(id){try{sessionStorage.removeItem(egzKey(id))}catch(e){}}
function egzCard(e){
  var k=kier(e.kierunek),p=przedmiot(e.przedmiot);
  return '<a class="ecard" href="#e-'+esc(e.id)+'" style="'+cvar(k)+'"><div class="eico">'+ICON_EGZ+'</div><div class="grow"><span class="pill">'+esc(k?k.skrot:"")+(e.klasa?' · klasa '+esc(e.klasa):'')+'</span><h3>'+esc(e.nazwa)+'</h3><p>'+esc(p?p.nazwa:(e.opis||""))+'</p><div class="emeta"><span><b>'+esc(e.liczba)+'</b> pytań</span><span><b>'+esc(e.czas)+'</b> min</span><span>baza: '+esc(e.pytan)+' pytań</span></div></div><span class="arr">→</span></a>';

function egzView(id){
  hero(false);
  app().innerHTML='<div class="empty">Wczytywanie egzaminu…</div>';
  egzLista().then(function(l){
    var e=l.filter(function(x){return x.id===id})[0];

function egzStart(e){

  app().innerHTML=crumb([["Egzaminy","egzaminy"],[e.nazwa]])+

   '<div class="erules"><div><b>'+esc(e.liczba)+'</b>pytań</div><div><b>'+esc(e.czas)+'</b>minut</div><div><b>1</b>poprawna odpowiedź</div><div><b>50%</b>próg zaliczenia</div></div>'+
   '<ul class="elist-rules"><li>Pytania są losowane z bazy — każdy uczeń dostaje inny zestaw.</li><li>Możesz wracać do pytań i zmieniać odpowiedzi do momentu wysłania.</li><li>Po upływie czasu test wyśle się automatycznie.</li><li>Nie odświeżaj karty i nie zamykaj przeglądarki w trakcie testu.</li></ul>'+

   '<div class="toolbar" style="margin:0"><button class="btn" id="e-go">Rozpocznij test →</button><span class="status" id="e-st"></span></div></div>':'<div class="banner" style="display:block">Moduł egzaminów nie jest jeszcze połączony z arkuszem wyników. Test będzie dostępny wkrótce.</div>')+
   '</div></div>';
  var go=$("#e-go"); if(!go) return;

    go.disabled=true;setStatus($("#e-st"),"Losuję pytania…");
    egzBank(e.id).then(function(b){
      var gs={},pool=shuffle(b.pytania).filter(function(q){var g=q.g||q.id;if(gs[g])return false;gs[g]=1;return true});var qs=pool.slice(0,Math.min(b.liczba||40,pool.length)).map(function(q){
        var ord=shuffle(q.o.map(function(_,i){return i}));return {id:q.id,q:q.q,parts:q.parts||null,o:ord.map(function(i){return q.o[i]}),map:ord,w:-1}});
      var st={imie:im,nazwisko:na,klasa:kl,start:Date.now(),koniec:Date.now()+(+e.czas||60)*60000,pytania:qs,cur:0};

function egzRun(e,st){
  var k=kier(e.kierunek),n=st.pytania.length;ui.lock=true;
  function answered(){return st.pytania.filter(function(q){return q.w>=0}).length}
  function draw(){
    var q=st.pytania[st.cur];
    $("#eq").innerHTML='<div class="eqnum">Pytanie '+(st.cur+1)+' z '+n+'</div>'+(q.parts&&q.parts.length?'<div class="eparts">'+q.parts.map(function(pt){return pt.img?'<a class="eimg" href="'+esc(egzUrl(pt.img))+'" target="_blank" rel="noopener" title="Kliknij, aby powiększyć"><img src="'+esc(egzUrl(pt.img))+'" alt="Ilustracja do pytania" style="max-width:min(100%,'+Math.round((pt.w||400)*1.6)+'px)"></a>':'<h2>'+esc(pt.t)+'</h2>'}).join("")+'</div>':'<h2>'+esc(q.q)+'</h2>')+'<div class="eopts">'+q.o.map(function(o,i){return '<button class="eopt '+(q.w===i?"on":"")+'" data-o="'+i+'"><span class="el">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div>'+
      '<div class="enav"><button class="btn ghost" id="e-prev" '+(st.cur===0?"disabled":"")+'>← Poprzednie</button><button class="btn" id="e-next">'+(st.cur===n-1?"Podsumowanie":"Następne →")+'</button></div>';
    $("#egrid").innerHTML=st.pytania.map(function(x,i){return '<button class="'+(x.w>=0?"done ":"")+(i===st.cur?"cur":"")+'" data-g="'+i+'">'+(i+1)+'</button>'}).join("");
    $("#e-ans").textContent=answered()+" / "+n;
    $$("[data-o]").forEach(function(b){b.onclick=function(){q.w=+b.dataset.o;egzSave(e.id,st);draw()}});
    $$("[data-g]").forEach(function(b){b.onclick=function(){st.cur=+b.dataset.g;egzSave(e.id,st);draw()}});
    $("#e-prev").onclick=function(){if(st.cur>0){st.cur--;egzSave(e.id,st);draw()}};
    $("#e-next").onclick=function(){if(st.cur<n-1){st.cur++;egzSave(e.id,st);draw()}else $("#e-end").click()};
  }
  app().innerHTML='<div class="erun" style="'+cvar(k)+'"><div class="ebar"><div><b>'+esc(e.nazwa)+'</b><span>'+esc(st.imie+" "+st.nazwisko)+(st.klasa?" · "+esc(st.klasa):"")+'</span></div><div class="etime" id="e-time">--:--</div><div class="eans">Odpowiedzi: <b id="e-ans"></b></div><button class="btn sm" id="e-end">Zakończ i wyślij</button></div>'+
    '<div class="ebody"><div class="panel" id="eq"></div><aside class="panel egridw"><p class="sec-label" style="margin:0 0 10px">Pytania</p><div class="egrid" id="egrid"></div><p class="note" style="margin:12px 0 0">Zielone — z odpowiedzią.</p></aside></div></div>';
  draw();
  if(st.pytania.some(function(q){return q.parts===undefined})) egzBank(e.id).then(function(b){
    var m={};b.pytania.forEach(function(x){m[x.id]=x.parts||null});
    st.pytania.forEach(function(q){if(q.parts===undefined)q.parts=m[q.id]||null});egzSave(e.id,st);if($("#eq"))draw();
  }).catch(function(){});
  function tick(){var left=Math.max(0,st.koniec-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000),t=$("#e-time");if(!t){clearInterval(ui.timer);return}
    t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("warn",left<5*60000);
    if(left<=0){clearInterval(ui.timer);egzSend(e,st,true)}}

    var brak=n-answered(),b=$("#e-end");
    if(b.dataset.ok){egzSend(e,st,false);return}
    b.dataset.ok="1";b.textContent=brak?"Brak odpowiedzi: "+brak+" — wyślij mimo to":"Na pewno wysłać?";b.classList.add("danger");
    setTimeout(function(){if(b.isConnected){delete b.dataset.ok;b.textContent="Zakończ i wyślij";b.classList.remove("danger")}},5000);

function egzSend(e,st,auto){

  app().innerHTML='<div class="empty">'+(auto?"Czas minął. ":"")+'Wysyłanie odpowiedzi…</div>';

  fetch(S.config.egzaminUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
   .then(function(r){return r.json()}).then(function(r){
     if(!r||!r.ok) throw new Error(r&&r.blad||"Serwer nie przyjął odpowiedzi.");
     st.wynik=r;egzSave(e.id,st);ui.lock=false;egzResult(e,st);

     $("#e-retry").onclick=function(){egzSend(e,st,false)};
   });
}

function readImage(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=rej;
    if(file.type==="image/svg+xml"){r.onload=function(){res(r.result)};r.readAsDataURL(file);return}
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=1400,w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
        var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        var q=0.85,out=c.toDataURL("image/jpeg",q);
        if(file.type==="image/png"){var png=c.toDataURL("image/png");if(png.length<170000)out=png}
        while(out.length>170000&&q>0.35){q-=0.1;out=c.toDataURL("image/jpeg",q)}
        res(out);
      };
      im.onerror=rej; im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

  $$("[data-k]",M()).forEach(function(el){el.oninput=function(){var x=el.dataset.k.split(".");c.kierunki[+x[0]][x[1]]=el.value}});
  $("#k-save").onclick=async function(){var nc=clone(S.config);nc.kierunki=clone(c.kierunki);if(await run($("#k-st"),function(){return Store.saveConfig(nc)})){a.cfg=null;updateNav()}};
}
/* --- ustawienia --- */
function cfgAdmin(){
  var c=S.config;
  M().innerHTML='<h2>Ustawienia strony</h2><div class="form">'+
   '<div class="row2"><div class="field"><label>Nazwa platformy</label><input type="text" id="c-t" value="'+esc(c.tytul)+'"></div><div class="field"><label>Podpis pod nazwą</label><input type="text" id="c-p" value="'+esc(c.podtytul)+'"></div></div>'+
   '<div class="field"><label>Autor (pod statystykami na stronie głównej)</label><input type="text" id="c-g" value="'+esc(c.heroTag)+'"></div>'+
   '<div class="field"><label>Nagłówek strony głównej</label><input type="text" id="c-h" value="'+esc(c.heroTytul)+'"></div>'+
   '<div class="field"><label>Tekst powitalny</label><textarea id="c-o">'+esc(c.heroOpis)+'</textarea></div>'+
   '<div class="field"><label>Adres strony dla uczniów</label><input type="text" id="c-a" value="'+esc(c.adresStrony)+'"><div class="hint">Używany do otwierania plików z panelu na claude.ai.</div></div>'+
   '<div class="field"><label>Adres skryptu egzaminów (Google Apps Script)</label><input type="text" id="c-e" value="'+esc(c.egzaminUrl||"")+'" placeholder="https://script.google.com/macros/s/…/exec"><div class="hint">Wyniki egzaminów trafiają do arkusza Google pod tym adresem. Podgląd wyników: strona #wyniki.</div></div>'+
   '<div class="field"><label>Stopka</label><input type="text" id="c-s" value="'+esc(c.stopka)+'"></div>'+
   '<div class="field"><label>Progi ocen w testach i kartach oceniania (% punktów)</label><div class="optrow">'+["bdb","db","dst","dop"].map(function(l,i){return '<span class="mono">'+l+' ≥</span><input type="number" id="c-pr'+i+'" value="'+c.progi[i]+'" style="width:70px;border:1px solid var(--line);border-radius:5px;padding:7px">'}).join("")+'</div><div class="hint">Poniżej progu „dop” — niedostateczny.</div></div>'+
   '</div><div class="stickybar"><button class="btn" id="c-save">Zapisz ustawienia</button><span class="status" id="c-st"></span></div>';
  $("#c-save").onclick=async function(){
    var nc=clone(S.config);nc.tytul=$("#c-t").value.trim()||DEFAULT_CONFIG.tytul;nc.podtytul=$("#c-p").value.trim();nc.heroTag=$("#c-g").value.trim();nc.heroTytul=$("#c-h").value.trim();nc.heroOpis=$("#c-o").value.trim();nc.stopka=$("#c-s").value.trim();nc.adresStrony=$("#c-a").value.trim();nc.egzaminUrl=$("#c-e").value.trim();
    nc.progi=[0,1,2,3].map(function(i){return +$("#c-pr"+i).value||0});
    if(await run($("#c-st"),function(){return Store.saveConfig(nc)})) updateNav();
  };
}
/* --- publikacja i kopia --- */
function buildStudentSite(){
  var css=$("#css").textContent,js=$("#app-js").textContent;
  var data={config:S.config,przedmioty:S.przedmioty,materialy:S.materialy};
  var json=JSON.stringify(data).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="pl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(S.config.tytul)+'</title>\n<link href="'+FONTS+'" rel="stylesheet">\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script>window.EMBEDDED='+json+';<\/script>\n<script id="app-js">'+js+'<\/script>\n</body>\n</html>\n';
}
async function offerFile(name,data){
  if(window.claude&&typeof window.claude.use==="function"){
    try{var d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:data});return "ok"}}
    catch(e){if(e&&e.code==="declined")return "declined"}
  }
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return "ok"}catch(e){return "fail"}
}
function exportAdmin(){
  var np=S.przedmioty.length,nm=S.materialy.length;
  M().innerHTML='<h2>Publikacja i kopia zapasowa</h2>'+
   '<div class="panel" style="margin-bottom:16px"><h3 style="margin:0 0 6px">Strona dla uczniów</h3><p style="margin:0 0 10px;font-size:14px">Pobierz gotową stronę — jeden plik <span class="mono">index.html</span> z wszystkimi materiałami ('+np+' przedmiotów, '+nm+' materiałów), bez panelu administracyjnego. Wgraj go na hosting (GitHub Pages, Netlify, serwer szkolny) — uczniowie nie muszą mieć konta. Po zmianach w panelu pobierz plik ponownie i podmień w folderze strony <b>tylko index.html</b> — pozostałe pliki (Twoje dokumenty) zostaw obok niego i przeciągaj na Netlify wszystkie razem.</p>'+
   '<div class="toolbar" style="margin:0"><button class="btn" id="x-site">⬇ Pobierz stronę dla uczniów</button><span class="status" id="x-st"></span></div></div>'+
   '<div class="panel" style="margin-bottom:16px"><h3 style="margin:0 0 6px">Kopia zapasowa</h3><p style="margin:0 0 10px;font-size:14px">Plik JSON ze wszystkimi danymi. Zrób kopię przed większymi zmianami.</p><div class="toolbar" style="margin:0"><button class="btn ghost" id="x-json">⬇ Pobierz kopię JSON</button><span class="status" id="x-st2"></span></div></div>'+
   '<div class="panel"><h3 style="margin:0 0 6px">Przywróć z kopii</h3><p style="margin:0 0 10px;font-size:14px">Wczytanie kopii <b>zastępuje</b> wszystkie obecne przedmioty, materiały i ustawienia.</p><div class="form"><input type="file" accept=".json,application/json" id="x-file"><div class="toolbar" style="margin:0"><button class="btn danger" id="x-imp" disabled>Przywróć dane z kopii</button><span class="status" id="x-st3"></span></div></div></div>';
  $("#x-site").onclick=async function(){setStatus($("#x-st"),"Przygotowywanie…");var r=await offerFile("index.html",buildStudentSite());setStatus($("#x-st"),r==="ok"?"Gotowe ✓":r==="declined"?"Anulowano.":"Pobieranie nie powiodło się.",r==="ok")};
  $("#x-json").onclick=async function(){var r=await offerFile("platforma-kopia-"+todayStr()+".json",JSON.stringify({config:S.config,przedmioty:S.przedmioty,materialy:S.materialy},null,1));setStatus($("#x-st2"),r==="ok"?"Gotowe ✓":r==="declined"?"Anulowano.":"Pobieranie nie powiodło się.",r==="ok")};
  var parsed=null;
  $("#x-file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{parsed=JSON.parse(r.result);if(!parsed.przedmioty||!parsed.materialy)throw 0;$("#x-imp").disabled=false;setStatus($("#x-st3"),"Plik OK: "+parsed.przedmioty.length+" przedmiotów, "+parsed.materialy.length+" materiałów.",true)}catch(e){parsed=null;$("#x-imp").disabled=true;setStatus($("#x-st3"),"To nie jest poprawna kopia platformy.",false)}};r.readAsText(f)};
  confirmBtn($("#x-imp"),async function(){if(!parsed)return;var b=$("#x-imp");b.disabled=true;try{await Store.replaceAll(parsed,function(t){setStatus($("#x-st3"),t)});setStatus($("#x-st3"),"Przywrócono ✓",true)}catch(e){setStatus($("#x-st3"),errMsg(e),false)}updateNav()});
}

init();
})();
</script>
